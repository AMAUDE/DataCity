name: Déployer DataCity sur GitHub Pages

on:
  push:
    branches: [main, claude/geographic-data-library-o0329j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Téléverser docs/ (application autonome)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
