<title>DataCity — Aperçu Côte d'Ivoire</title>
<div id="app"></div>
<style>
:root{
  --bg:#f7f5f1; --panel:#ffffff; --ink:#1b2430; --muted:#5b6675; --line:#e7e2d9;
  --orange:#e56b00; --green:#00875a; --accent:#e56b00;
  --ok:#0f9d58; --warn:#c98a00; --chip:#f0ece3;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px rgba(20,25,35,.05);
  --map-land:#e3d7bf; --map-stroke:#a5854f; --map-bg:#cfe0e8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1119; --panel:#131a25; --ink:#e8edf5; --muted:#93a0b3; --line:#212c3b;
  --orange:#ff8a2b; --green:#2bbd85; --accent:#ff8a2b;
  --ok:#39d98a; --warn:#f0b429; --chip:#1b2431;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --map-land:#26374a; --map-stroke:#5c7fa6; --map-bg:#0a1420;
}}
:root[data-theme="light"]{--bg:#f7f5f1;--panel:#fff;--ink:#1b2430;--muted:#5b6675;--line:#e7e2d9;--orange:#e56b00;--green:#00875a;--accent:#e56b00;--ok:#0f9d58;--warn:#c98a00;--chip:#f0ece3;--map-land:#e3d7bf;--map-stroke:#a5854f;--map-bg:#cfe0e8;--shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px rgba(20,25,35,.05);}
:root[data-theme="dark"]{--bg:#0c1119;--panel:#131a25;--ink:#e8edf5;--muted:#93a0b3;--line:#212c3b;--orange:#ff8a2b;--green:#2bbd85;--accent:#ff8a2b;--ok:#39d98a;--warn:#f0b429;--chip:#1b2431;--map-land:#26374a;--map-stroke:#5c7fa6;--map-bg:#0a1420;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}
a{color:inherit}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.01em;font-size:18px}
.flag{display:flex;height:22px;width:33px;border-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
.flag i{flex:1}.flag i:nth-child(1){background:var(--orange)}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:var(--green)}
:root[data-theme="dark"] .flag i:nth-child(2),@media(prefers-color-scheme:dark){.flag i:nth-child(2){background:#eef2f7}}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--muted)}
.themebtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;
  padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.themebtn:hover{color:var(--ink)}

.hero{padding:40px 0 26px}
.hero h1{font-size:clamp(26px,4.5vw,42px);letter-spacing:-.02em;max-width:15ch}
.hero p{color:var(--muted);max-width:60ch;margin-top:14px;font-size:clamp(15px,1.6vw,17px)}
.note{margin-top:18px;display:flex;gap:10px;align-items:flex-start;background:var(--chip);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);max-width:70ch}
.note b{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 4px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:760;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi .bar{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.kpi .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--green))}

section{padding:34px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-head h2{font-size:20px;letter-spacing:-.01em}
.sec-head .hint{color:var(--muted);font-size:13px}

.explorer{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.explorer{grid-template-columns:1.05fr .95fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.mapcard{padding:12px;overflow:hidden;position:relative}
.mapcard svg{width:100%;height:auto;display:block;background:var(--map-bg);border-radius:10px}
.mapbadge{position:absolute;top:20px;left:20px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;font-size:12px;font-weight:650;box-shadow:var(--shadow);pointer-events:none}
.mapbadge b{color:var(--accent);font-size:15px}
.mapttl{position:absolute;top:20px;right:20px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;padding:10px 6px 2px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%}

.filters{padding:14px}
.filters .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:99px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:8px;height:8px;border-radius:50%}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.togg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:2px}

.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:650;font-size:12px;
  text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td.name{white-space:normal;font-weight:600;min-width:180px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:650}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:13px;color:var(--muted)}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);font-size:12.5px}
.pbtn:disabled{opacity:.4;cursor:default}

.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.themes{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.themes{grid-template-columns:repeat(5,1fr)}}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px}
.tcard .nm{font-weight:680;margin-top:10px;font-size:14px}
.tcard .mt{color:var(--muted);font-size:12px;margin-top:3px}

.sources{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.sources{grid-template-columns:1fr 1fr}}
.src{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow)}
.src .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.src .nm{font-weight:670;font-size:14.5px}
.stars{letter-spacing:1px;font-size:12px}
.src .desc{color:var(--muted);font-size:12.5px;margin-top:6px}
.src .lic{color:var(--muted);font-size:11.5px;margin-top:6px}

footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
const {catalog,districts,points,table}=window.DCDATA;
const themeColor={}, themeName={}, themeIcon={};
catalog.themes.forEach(t=>{themeColor[t.slug]=t.color;themeName[t.slug]=t.name;themeIcon[t.slug]=t.icon;});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- projection ----------
let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
districts.forEach(d=>d.rings.forEach(r=>r.forEach(([x,y])=>{if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;})));
const W=1000,PAD=16;
const spanX=maxX-minX,spanY=maxY-minY;
const H=Math.round((W-2*PAD)*(spanY/spanX)+2*PAD);
const px=x=>PAD+(x-minX)/spanX*(W-2*PAD);
const py=y=>PAD+(maxY-y)/spanY*(H-2*PAD);

let pathData=districts.map(d=>{
  const dd=d.rings.map(r=>"M"+r.map(([x,y])=>px(x).toFixed(1)+","+py(y).toFixed(1)).join("L")+"Z").join("");
  return '<path d="'+dd+'" fill="var(--map-land)" stroke="var(--map-stroke)" stroke-width="1.4" stroke-linejoin="round"><title>'+esc(d.name)+' (district)</title></path>';
}).join("");

// ---------- state ----------
let state={theme:"all",q:"",verified:false,page:1,per:12};

const app=document.getElementById("app");
app.innerHTML=`
<header><div class="wrap nav">
  <div class="brand"><span class="flag"><i></i><i></i><i></i></span> DataCity<span style="color:var(--accent)">.ci</span></div>
  <button class="themebtn" id="tt">Thème</button>
</div></header>
<main class="wrap">
  <div class="hero">
    <div class="eyebrow">Bibliothèque géographique · Côte d'Ivoire</div>
    <h1>La donnée vraie, vérifiée et cartographiée.</h1>
    <p>Base de référence multi-sources : infrastructures (éducation, santé, administration, sécurité, défense, finance, justice) et limites administratives, consultables en table et sur la carte.</p>
    <div class="note"><span>ℹ️</span><div><b>Aperçu interactif</b> de la plateforme, avec les données réelles chargées. Sur la version en ligne, chaque jeu se télécharge (GeoJSON/CSV/JSON) après identification.</div></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <section>
    <div class="sec-head"><h2>Cartographie & exploration</h2><span class="hint">Filtrez : la carte et la table se mettent à jour ensemble</span></div>
    <div class="explorer">
      <div class="card mapcard">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte des districts de Côte d'Ivoire">
          <g id="land">${pathData}</g>
          <g id="pts"></g>
        </svg>
        <div class="mapbadge"><b id="mapcount" class="tnum">0</b> équipements affichés</div>
        <div class="mapttl">Côte d'Ivoire · 14 districts</div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card filters">
        <div class="row" id="chips"></div>
        <input type="search" id="q" placeholder="Rechercher un équipement…" />
        <label class="togg"><input type="checkbox" id="vf"> Afficher uniquement les données vérifiées</label>
        <div class="tablewrap">
          <table><thead><tr><th>Nom</th><th>Type</th><th class="c-adm">District/Région</th><th>État</th></tr></thead>
          <tbody id="tb"></tbody></table>
        </div>
        <div class="pager"><span id="count"></span><span style="display:flex;gap:8px;align-items:center">
          <button class="pbtn" id="prev">←</button><span id="pg" class="tnum"></span><button class="pbtn" id="next">→</button></span></div>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>Thématiques</h2><span class="hint">${catalog.stats.datasets} jeux de données</span></div>
    <div class="themes" id="themes"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Sources</h2><span class="hint">Chaque donnée porte sa provenance et sa fiabilité</span></div>
    <div class="sources" id="sources"></div>
  </section>
</main>
<footer><div class="wrap">DataCity — Bibliothèque de référence des données géographiques de Côte d'Ivoire · données multi-sources, vérifiées, téléchargeables.</div></footer>`;

// KPIs
const s=catalog.stats, pct=Math.round(s.verified/s.features*100);
document.getElementById("kpis").innerHTML=[
  [s.themes,"Thématiques",null],[s.sources,"Sources",null],[s.datasets,"Jeux de données",null],
  [s.features,"Entités géo.",null],[pct+"%","Vérifiées",pct]
].map(([n,l,p])=>`<div class="kpi"><div class="n tnum">${n}</div><div class="l">${l}</div>${p!=null?`<div class="bar"><span style="width:${p}%"></span></div>`:""}</div>`).join("");

// Chips
const chips=[{slug:"all",name:"Toutes",icon:"◍"}].concat(catalog.themes);
document.getElementById("chips").innerHTML=chips.map(t=>
  `<button class="chip" data-t="${t.slug}" aria-pressed="${t.slug==="all"}">${t.slug==="all"?"◍":`<span class="sw" style="background:${themeColor[t.slug]}"></span>`}${esc(t.name)}</button>`).join("");

// Legend (infrastructure themes only)
document.getElementById("legend").innerHTML=catalog.themes.filter(t=>t.category==="infrastructure").map(t=>
  `<span class="li"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</span>`).join("");

// Themes grid
document.getElementById("themes").innerHTML=catalog.themes.map(t=>{
  const n=t.datasets.reduce((a,d)=>a+d.count,0);
  return `<div class="tcard" data-t="${t.slug}"><div class="ic" style="background:color-mix(in srgb,${t.color} 18%,transparent)">${t.icon}</div>
  <div class="nm">${esc(t.name)}</div><div class="mt tnum">${n} entités · ${t.category==="infrastructure"?"infrastructure":"limites"}</div></div>`;
}).join("");

// Sources
const stars=n=>"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n);
document.getElementById("sources").innerHTML=catalog.sources.map(x=>
  `<div class="src"><div class="top"><span class="nm">${esc(x.name)}</span><span class="stars" style="color:var(--orange)">${stars(x.reliability)}</span></div>
  ${x.description?`<div class="desc">${esc(x.description)}</div>`:""}
  <div class="lic">${x.datasets} jeu(x)${x.license?" · "+esc(x.license):""}</div></div>`).join("");

// ---------- rendering / filtering ----------
function match(f){
  if(state.theme!=="all" && (!f.theme||f.theme.slug!==state.theme)) return false;
  if(state.verified && !f.verified) return false;
  if(state.q && !f.name.toLowerCase().includes(state.q.toLowerCase())) return false;
  return true;
}
function renderPts(){
  const g=document.getElementById("pts");
  let shown=0;
  g.innerHTML=points.map(p=>{
    const on=match(p);
    if(on)shown++;
    const c=themeColor[p.theme&&p.theme.slug]||"var(--accent)";
    return `<circle cx="${px(p.lng).toFixed(1)}" cy="${py(p.lat).toFixed(1)}" r="${on?6:3}" fill="${on?c:"var(--map-stroke)"}" fill-opacity="${on?1:.3}" stroke="${on?"var(--panel)":"none"}" stroke-width="${on?2:0}" style="filter:${on?"drop-shadow(0 1px 2px rgba(0,0,0,.35))":"none"}"><title>${esc(p.name)} — ${esc(p.type)}${p.admin1?" · "+esc(p.admin1):""}</title></circle>`;
  }).join("");
  const mc=document.getElementById("mapcount"); if(mc)mc.textContent=shown;
}
function renderTable(){
  const rows=table.filter(match);
  const pages=Math.max(1,Math.ceil(rows.length/state.per));
  if(state.page>pages)state.page=pages;
  const slice=rows.slice((state.page-1)*state.per,state.page*state.per);
  document.getElementById("tb").innerHTML=slice.map(f=>`<tr>
    <td class="name">${esc(f.name)}</td>
    <td><span class="tag"><span class="dot" style="background:${themeColor[f.theme&&f.theme.slug]||"var(--muted)"}"></span>${esc(f.type)}</span></td>
    <td class="c-adm">${esc(f.admin1||"—")}</td>
    <td>${f.verified?'<span class="badge b-ok">vérifié</span>':'<span class="badge b-warn">à vérifier</span>'}</td>
  </tr>`).join("")||`<tr><td colspan="4" style="padding:26px;text-align:center;color:var(--muted)">Aucun résultat.</td></tr>`;
  document.getElementById("count").textContent=rows.length+" entité"+(rows.length>1?"s":"");
  document.getElementById("pg").textContent=state.page+" / "+pages;
  document.getElementById("prev").disabled=state.page<=1;
  document.getElementById("next").disabled=state.page>=pages;
}
function refresh(){renderPts();renderTable();}

// events
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b)return;
  state.theme=b.dataset.t; state.page=1;
  document.querySelectorAll("#chips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.t===state.theme));
  refresh();
});
document.getElementById("themes").addEventListener("click",e=>{
  const c=e.target.closest(".tcard"); if(!c)return;
  state.theme=c.dataset.t; state.page=1;
  document.querySelectorAll("#chips .chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===state.theme));
  document.querySelector(".explorer").scrollIntoView({behavior:"smooth",block:"start"});
  refresh();
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;state.page=1;renderTable();renderPts();});
document.getElementById("vf").addEventListener("change",e=>{state.verified=e.target.checked;state.page=1;refresh();});
document.getElementById("prev").addEventListener("click",()=>{state.page--;renderTable();});
document.getElementById("next").addEventListener("click",()=>{state.page++;renderTable();});

// theme toggle
const root=document.documentElement;
document.getElementById("tt").addEventListener("click",()=>{
  const cur=root.getAttribute("data-theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  root.setAttribute("data-theme",cur==="dark"?"light":"dark");
});

refresh();
})();
</script>
